name: Deploy MOORE Site-to-Program to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate unified offline HTML
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          content = Path("index.html").read_text(encoding="utf-8")
          assert "ARCHIFLOW_UNIFIED_V8" in content
          assert "ARCHIFLOW_PROJECT_HISTORY_V9" in content
          assert "ARCHIFLOW_DESIGN_DEVELOPMENT_V10" in content
          assert "ARCHIFLOW_V11_EMBED" in content
          assert "window.unifiedResponseAPI" in content
          assert 'id="offStudio"' in content
          scripts = re.findall(r"<script>(.*?)</script>", content, re.S)
          assert len(scripts) == 6, f"Unexpected number of scripts: {len(scripts)}"
          for i, js in enumerate(scripts):
              Path(f"/tmp/archiflow-unified-{i}.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/archiflow-unified-0.js
          node --check /tmp/archiflow-unified-1.js
          node --check /tmp/archiflow-unified-2.js
          node --check /tmp/archiflow-unified-3.js
          node --check /tmp/archiflow-unified-4.js
          node --check /tmp/archiflow-unified-5.js
          python3 - <<'PY2'
          import re
          from pathlib import Path
          code = Path("game-lab/index.html").read_text(encoding="utf-8")
          assert "ARCHIFLOW CLIMATE GAME V11" in code
          blocks = re.findall(r"<script>(.*?)</script>",code,re.S)
          assert len(blocks)==1
          Path("/tmp/archiflow-game-v11.js").write_text(blocks[0],encoding="utf-8")
          PY2
          node --check /tmp/archiflow-game-v11.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
