name: Deploy MOORE Site-to-Program to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate unified offline HTML
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          content = Path("index.html").read_text(encoding="utf-8")
          assert "ARCHIFLOW_UNIFIED_V8" in content
          assert "ARCHIFLOW_PROJECT_HISTORY_V9" in content
          assert "window.unifiedResponseAPI" in content
          assert 'id="offStudio"' in content
          scripts = re.findall(r"<script>(.*?)</script>", content, re.S)
          assert len(scripts) == 3, f"Unexpected number of scripts: {len(scripts)}"
          for i, js in enumerate(scripts):
              Path(f"/tmp/archiflow-unified-{i}.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/archiflow-unified-0.js
          node --check /tmp/archiflow-unified-1.js
          node --check /tmp/archiflow-unified-2.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
